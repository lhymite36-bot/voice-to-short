name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*-windows']
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npx electron-builder --win nsis portable --x64 --publish never
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - shell: pwsh
        working-directory: desktop/dist
        run: Get-ChildItem *.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt; Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "desktop/dist/*.exe\ndesktop/dist/SHA256SUMS.txt" }
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" desktop/dist/*.exe desktop/dist/SHA256SUMS.txt --title "Voice to Short 1.7.0 for Windows" --notes-file desktop/RELEASE_NOTES.md --latest=false
